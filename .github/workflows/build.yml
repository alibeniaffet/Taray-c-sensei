name: Build NetAI Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NetAI Browser
    runs-on: ubuntu-24.04

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kontrolü
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: ZIP'i aç
        shell: bash
        run: |
          set -e

          rm -rf buildsrc
          mkdir -p buildsrc

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'NetAI-Browser-Project.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ NetAI-Browser-Project.zip bulunamadı."
            exit 1
          fi

          echo "📦 ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d buildsrc

          echo "📁 Proje:"
          find buildsrc -maxdepth 2 -type f | sort

      - name: Gradle proje kontrolü
        working-directory: buildsrc
        run: |
          echo "Gradle sürümü:"
          gradle --version

          echo "Settings:"
          cat settings.gradle

          echo "App build.gradle:"
          cat app/build.gradle

      - name: APK derle
        working-directory: buildsrc
        run: |
          gradle --no-daemon --stacktrace --info assembleDebug

      - name: APK dosyasını kontrol et
        run: |
          if [ ! -f "buildsrc/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "❌ APK oluşturulamadı!"
            exit 1
          fi

          echo "✅ APK başarıyla oluşturuldu:"
          ls -lh buildsrc/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: NetAI-Browser-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

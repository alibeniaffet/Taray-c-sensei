name: Build NetAI Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        shell: bash
        run: |
          set -e
          mkdir -p buildsrc
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'NetAI-Browser-Project.zip' -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d buildsrc
          else
            echo "NetAI-Browser-Project.zip bulunamadı."
            exit 1
          fi
          test -f buildsrc/settings.gradle
          test -d buildsrc/app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetAI-Browser-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
